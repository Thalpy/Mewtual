# cargo-deny configuration. Run with: cargo deny check
# Supply-chain is a first-class concern (see docs/ARCHITECTURE.md threat model).

[advisories]
yanked = "deny"

# Each ignore is a decision, not a mute button: it names why the advisory does not reach us and
# what would make it reach us. Re-read this list whenever the MLS stack moves.

# Build-time proc-macro crates that are merely unmaintained, not vulnerable. Both arrive
# transitively (paste via the crypto stack, proc-macro-error2 via libcrux's hax-lib-macros) and
# neither has a safe upgrade. They run at build time and ship no code into the binary.
[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste: unmaintained, no vulnerability, transitive, no upgrade available"

[[advisories.ignore]]
id = "RUSTSEC-2026-0173"
reason = "proc-macro-error2: unmaintained, no vulnerability, transitive, no upgrade available"

# The three libcrux advisories below are pinned in place by openmls_rust_crypto 0.5, which
# requires hpke-rs ^0.6, which requires libcrux-sha3 0.0.8. The fixed 0.0.10 cannot be selected
# without moving to the openmls 0.9 release-candidate line, which is a protocol decision rather
# than a lint fix. Drop these ignores the moment openmls_rust_crypto 0.5.x bumps hpke-rs.
#
# Neither SHAKE advisory is reachable from this app: crates/catcoms-mls/src/config.rs pins the
# single ciphersuite MLS_128_DHKEMX25519_CHACHA20POLY1305_SHA256_Ed25519 and advertises no other,
# so the group never negotiates SHA-3/SHAKE or ML-KEM at all.
[[advisories.ignore]]
id = "RUSTSEC-2026-0207"
reason = "libcrux-sha3 incremental SHAKE: unreachable, our pinned ciphersuite never uses SHAKE"

[[advisories.ignore]]
id = "RUSTSEC-2026-0208"
reason = "libcrux-sha3 AVX2 SHAKE-256 panic: unreachable, our pinned ciphersuite never uses SHAKE"

# NOTE: this one is architecture-scoped, not unreachable. It is inert on the x64 builds we ship
# today, and becomes live the day Mewtual builds for aarch64 (Windows on ARM, Apple Silicon,
# ARM Linux). Revisit before adding any ARM target.
[[advisories.ignore]]
id = "RUSTSEC-2026-0212"
reason = "libcrux-secrets constant-time swap on aarch64: we ship x64 only; revisit for any ARM build"

# hickory-proto arrives through libp2p-dns 0.44 (libp2p 0.56), which pins the 0.25 line. Both
# advisories below sit behind that pin: drop them the moment libp2p moves to a hickory 0.26 line.
#
# The NSEC3 loop lives in DNSSEC proof validation. No crate in either lockfile enables any
# dnssec feature (grep the locks: zero hits), so the vulnerable code is not compiled into the
# binary. There is also no patched release to move to yet (patched = [] as of 2026-08-22).
[[advisories.ignore]]
id = "RUSTSEC-2026-0118"
reason = "hickory-proto NSEC3 validation loop: DNSSEC features are not compiled in; no patched release exists"

# The O(n^2) name compression is in message *encoding*. As a stub resolver we encode only our
# own single-name queries; an attacker cannot make this client encode a many-name message, so
# the quadratic path is not attacker-drivable here. Fixed only in 0.26.1, behind the libp2p pin.
[[advisories.ignore]]
id = "RUSTSEC-2026-0119"
reason = "hickory-proto O(n^2) encoding: client encodes only its own small queries; fix requires hickory 0.26 via a libp2p bump"

[bans]
# Flag duplicate versions of the same crate; tighten to "deny" as the tree stabilises.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path with no version, which cargo-deny counts as a
# wildcard. That check exists to stop `foo = "*"` against a registry, which this is not: a path
# dependency resolves to the tree in front of you, so there is no unpinned third party involved.
allow-wildcard-paths = true

[licenses]
# Permissive + the copyleft variants we expect from the crypto/p2p ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # File-level copyleft, reached only by linking unmodified crates: hpke-rs (via OpenMLS) and
    # attohttpc (via igd-next, for UPnP port mapping). MPL-2.0 obligations attach to modified
    # MPL files, so using these as dependencies does not reach into our own source.
    "MPL-2.0",
    # webpki-roots: the Mozilla CA bundle shipped as data. CDLA-Permissive-2.0 is a permissive
    # data license (attribution-free use, modification and redistribution of the data set).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Our own crates carry no `license` field and are all `publish = false`. The project's terms live
# in /LICENSE, which is bespoke rather than an SPDX identifier, so there is nothing to declare
# here that cargo-deny could verify. This check is about what we consume, not what we are.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
