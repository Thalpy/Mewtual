# cargo-deny configuration. Run with: cargo deny check
# Supply-chain is a first-class concern (see docs/ARCHITECTURE.md threat model).

[advisories]
yanked = "deny"

# Each ignore is a decision, not a mute button: it names why the advisory does not reach us and
# what would make it reach us. Re-read this list whenever the MLS stack moves.

# Build-time proc-macro crates that are merely unmaintained, not vulnerable. Both arrive
# transitively (paste via the crypto stack, proc-macro-error2 via libcrux's hax-lib-macros) and
# neither has a safe upgrade. They run at build time and ship no code into the binary.
[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste: unmaintained, no vulnerability, transitive, no upgrade available"

[[advisories.ignore]]
id = "RUSTSEC-2026-0173"
reason = "proc-macro-error2: unmaintained, no vulnerability, transitive, no upgrade available"

# hickory-proto arrives through libp2p-dns 0.44 (libp2p 0.56), which pins the 0.25 line. Both
# advisories below sit behind that pin: drop them the moment libp2p moves to a hickory 0.26 line.
#
# The NSEC3 loop lives in DNSSEC proof validation. No crate in either lockfile enables any
# dnssec feature (grep the locks: zero hits), so the vulnerable code is not compiled into the
# binary. There is also no patched release to move to yet (patched = [] as of 2026-08-22).
[[advisories.ignore]]
id = "RUSTSEC-2026-0118"
reason = "hickory-proto NSEC3 validation loop: DNSSEC features are not compiled in; no patched release exists"

# The O(n^2) name compression is in message *encoding*. As a stub resolver we encode only our
# own single-name queries; an attacker cannot make this client encode a many-name message, so
# the quadratic path is not attacker-drivable here. Fixed only in 0.26.1, behind the libp2p pin.
[[advisories.ignore]]
id = "RUSTSEC-2026-0119"
reason = "hickory-proto O(n^2) encoding: client encodes only its own small queries; fix requires hickory 0.26 via a libp2p bump"

# 0.26.11 is only a compatibility re-export: src/lib.rs contains
# `pub use parent::TLS_SERVER_ROOTS`, with parent = webpki-roots ^1. Both locks now resolve
# that parent to 1.0.10, which removes the affected root. The advisory nevertheless matches
# the shim's old version. The bans below are REQUIRED with this exception: they reject every
# affected published concrete root bundle, including the published prerelease family, so a downgrade cannot hide
# behind this advisory-wide ignore. Remove the exception when libp2p drops the shim or the
# upstream advisory classifies this forwarding version separately. No verifier exception:
# rustls-webpki is independently updated to 0.103.16 in both workspaces.
[[advisories.ignore]]
id = "RUSTSEC-2026-0381"
reason = "webpki-roots 0.26.11 only re-exports patched parent 1.0.10; mandatory bans below reject vulnerable stable bundles and the published 0.26.0 prereleases"

# crypto-bigint < 0.7.6: operations meant to be constant-time could branch on secrets (subtraction,
# zero counting, division, Montgomery multiplication). Full analysis:
# docs/design-crypto-bigint-upgrade.md.
#
# Where secrets meet crypto-bigint, and why this ignore is safe:
# - The ONLY native secret P-256 path is the voice local-channel bootstrap
#   (apps/desktop/src-tauri/src/voice_handoff/channel/bootstrap.rs: the ephemeral scalar, both
#   scalar multiplications, the shared secret). It is on p256 0.14 -> crypto-bigint >= 0.7.6.
# - crypto-bigint 0.5.5 remains only inside the openmls RustCrypto backend (openmls_rust_crypto,
#   openmls_basic_credential, hpke-rs-rust-crypto, all still on p256/p384/k256 0.13 in every
#   release). No secret reaches that code: catcoms-mls pins the single X25519/Ed25519 suite, signs
#   with Ed25519 only, and openmls rejects a foreign-suite KeyPackage (ValSem105) or Welcome
#   (CiphersuiteMismatch) before any HPKE operation; what a peer can drive is public-key ECDSA
#   verification. MLS refusal tests in catcoms-mls pin that (group/suite_refusal_tests.rs).
#   Even for 0.5.5 itself, the fixes in 0.7.6 are in code 0.5.5 lacks or ECDH does not call.
# - The bans below are REQUIRED with this exception. They keep the fixed line >= 0.7.6, confine
#   0.5.x to the reviewed wrapper chain at reviewed versions, and make a new direct user of the
#   0.13 curve crates fail. They cannot see a new call inside catcoms-mls; any change to its suite,
#   signature scheme or openmls version must re-read the design note first.
# Exit: remove this ignore and the crypto-bigint/0.13-curve bans when openmls releases a p256 0.14
# backend (upstream main has it; it needs Rust >= 1.94, which this workspace now uses).
[[advisories.ignore]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5.5 survives only in openmls's p256/p384/k256 0.13 code, which no secret reaches under the pinned X25519/Ed25519 suite; the native secret ECDH is on 0.7.x; bans below fence it"

[bans]
# Flag duplicate versions of the same crate; tighten to "deny" as the tree stabilises.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path with no version, which cargo-deny counts as a
# wildcard. That check exists to stop `foo = "*"` against a registry, which this is not: a path
# dependency resolves to the tree in front of you, so there is no unpinned third party involved.
allow-wildcard-paths = true

# Preserve RUSTSEC-2026-0381 enforcement despite its compatibility-shim false positive. Only
# the reviewed 0.26.11 forwarding crate and fixed >=1.0.10 bundles are permitted. Its parent
# appears as a separate package in the graph, so resolving it to 1.0.9 fails these bans.
deny = [
    { name = "webpki-roots", version = "<0.26.11", reason = "RUSTSEC-2026-0381: vulnerable concrete root bundle" },
    { name = "webpki-roots", version = ">0.26.11, <1.0.10", reason = "RUSTSEC-2026-0381: only exact 0.26.11 forwarding shim is exempt before fixed 1.0.10" },
    # Ordinary semver ranges exclude prereleases. Explicitly cover the published alpha.0/.1/.2
    # family; review this exception if another prerelease release-tuple is introduced upstream.
    { name = "webpki-roots", version = ">=0.26.0-alpha.0, <0.26.0", reason = "RUSTSEC-2026-0381: published prerelease root bundles must not bypass stable-version bans" },

    # RUSTSEC-2026-0387 fence (see the ignore above). Use the name/version form: `crate =
    # "name@<req>"` treats the part after `@` as an exact version and silently matches nothing.
    # Ring 0: crypto-bigint only inside curve crates, and never an affected 0.6/0.7 build. The
    # version-less entry also covers prereleases, which ordinary ranges skip.
    { name = "crypto-bigint", wrappers = ["elliptic-curve", "primefield"], reason = "RUSTSEC-2026-0387: only curve crates may use crypto-bigint" },
    { name = "crypto-bigint", version = ">=0.5.0-0, <0.5.0", reason = "RUSTSEC-2026-0387: affected prerelease" },
    { name = "crypto-bigint", version = ">=0.6.0-0, <0.6.0", reason = "RUSTSEC-2026-0387: affected prerelease" },
    { name = "crypto-bigint", version = ">=0.7.0-0, <0.7.0", reason = "RUSTSEC-2026-0387: affected prerelease" },
    { name = "crypto-bigint", version = ">=0.6.0, <0.7.6", reason = "RUSTSEC-2026-0387: the fixed line must stay >= 0.7.6" },
    # Ring 1: the 0.13 curve family only under the reviewed openmls backend crates. A new direct
    # user (e.g. a native p256 0.13 edge) fails here.
    { name = "elliptic-curve", version = "<0.14", wrappers = ["p256", "p384", "k256", "ecdsa", "primeorder"], reason = "RUSTSEC-2026-0387: elliptic-curve 0.13 carries crypto-bigint 0.5" },
    { name = "p256", version = "<0.14", wrappers = ["openmls_rust_crypto", "openmls_basic_credential", "hpke-rs-rust-crypto"], reason = "RUSTSEC-2026-0387: p256 0.13 only inside the reviewed MLS backend" },
    { name = "p384", version = "<0.14", wrappers = ["openmls_rust_crypto", "openmls_basic_credential", "hpke-rs-rust-crypto"], reason = "RUSTSEC-2026-0387: p384 0.13 only inside the reviewed MLS backend" },
    { name = "k256", version = "<0.14", wrappers = ["hpke-rs-rust-crypto"], reason = "RUSTSEC-2026-0387: k256 0.13 only inside the reviewed MLS backend" },
    { name = "ecdsa", version = "<0.17", wrappers = ["p256", "p384"], reason = "RUSTSEC-2026-0387: ecdsa 0.16 only under the 0.13 curves" },
    { name = "primeorder", version = "<0.14", wrappers = ["p256", "p384"], reason = "RUSTSEC-2026-0387: primeorder 0.13 only under the 0.13 curves" },
    # Ring 2: those backend crates only under catcoms-mls, at the reviewed versions (the analysis
    # read openmls 0.9.2's enforcement code). Moving any of them is a deliberate fence edit.
    { name = "openmls_rust_crypto", wrappers = ["catcoms-mls"], reason = "RUSTSEC-2026-0387: reviewed MLS backend, catcoms-mls only" },
    { name = "openmls_basic_credential", wrappers = ["catcoms-mls"], reason = "RUSTSEC-2026-0387: reviewed MLS signer, catcoms-mls only" },
    { name = "hpke-rs-rust-crypto", wrappers = ["openmls_rust_crypto"], reason = "RUSTSEC-2026-0387: reviewed HPKE provider, MLS backend only" },
    { name = "openmls", version = "<0.9.2", reason = "RUSTSEC-2026-0387 fence: reviewed version is 0.9.2" },
    { name = "openmls", version = ">0.9.2", reason = "RUSTSEC-2026-0387 fence: re-read the design note, then move this pin" },
    { name = "openmls_rust_crypto", version = "<0.6.0", reason = "RUSTSEC-2026-0387 fence: reviewed version is 0.6.0" },
    { name = "openmls_rust_crypto", version = ">0.6.0", reason = "RUSTSEC-2026-0387 fence: a newer backend may clear 0387; re-check and drop the exception" },
    { name = "openmls_basic_credential", version = "<0.6.0", reason = "RUSTSEC-2026-0387 fence: reviewed version is 0.6.0" },
    { name = "openmls_basic_credential", version = ">0.6.0", reason = "RUSTSEC-2026-0387 fence: re-check the signer's curve dependencies" },
    { name = "hpke-rs-rust-crypto", version = "<0.7.0", reason = "RUSTSEC-2026-0387 fence: reviewed version is 0.7.0" },
    { name = "hpke-rs-rust-crypto", version = ">0.7.0", reason = "RUSTSEC-2026-0387 fence: re-check the HPKE provider's curve dependencies" },
]

[licenses]
# Permissive + the copyleft variants we expect from the crypto/p2p ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # File-level copyleft, reached only by linking unmodified crates: hpke-rs (via OpenMLS) and
    # attohttpc (via igd-next, for UPnP port mapping). MPL-2.0 obligations attach to modified
    # MPL files, so using these as dependencies does not reach into our own source.
    "MPL-2.0",
    # webpki-roots: the Mozilla CA bundle shipped as data. CDLA-Permissive-2.0 is a permissive
    # data license (attribution-free use, modification and redistribution of the data set).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Our own crates carry no `license` field and are all `publish = false`. The project's terms live
# in /LICENSE, which is bespoke rather than an SPDX identifier, so there is nothing to declare
# here that cargo-deny could verify. This check is about what we consume, not what we are.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
