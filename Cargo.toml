[workspace]
resolver = "2"
members = [
    "crates/catcoms-wire",
    "crates/catcoms-rt",
    "crates/catcoms-crypto",
    "crates/catcoms-mls",
    "crates/catcoms-replication",
]
# cargo-fuzz crates carry their own (nightly) workspace; keep them out of the main build.
exclude = [
    "crates/catcoms-wire/fuzz",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
proptest = "1"

# Lints applied to every crate that opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# Lint groups must sit below individual lints so per-lint levels win.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
