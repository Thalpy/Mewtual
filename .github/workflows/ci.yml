name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # These bounded actor tests diagnose clock/transport boundaries before the much longer
      # complete workspace run. A failure still fails this job; no full-suite gate is replaced.
      - name: File transfer actor boundaries
        run: cargo test -p catcoms-app --all-features actor::file_transfers::tests
      - name: Test
        run: cargo test --all --all-features
      # WMI accepts independent broad windows/windows-core ranges. A valid lock resolution
      # can mix their incompatible COM interfaces while all Linux builds still pass. Check
      # that native dependency on Windows without compiling the entire WebView application.
      - name: Native Windows COM binding compatibility
        if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -p wmi
        env:
          CARGO_TARGET_DIR: target
      - name: Ambient-dependency gate
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-no-ambient.sh
      - name: Store raw-fs gate (I-4)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-store-raw-fs.sh

  deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      # The native workspace has an independent graph (including updater/WebView dependencies).
      # Audit it completely; a Root pass does not cover it. Keep the shared config explicit so
      # a deny.toml under apps/desktop cannot silently replace the reviewed fences.
      - name: Desktop workspace supply chain
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          # Setting `arguments` replaces the action's default `--all-features`; keep it, since
          # release builds enable `custom-protocol`.
          arguments: --all-features --config=deny.toml
          command: check

  linux-desktop:
    name: Linux frontend & Tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit the default-deny Docker build context
        run: |
          mkdir -p .claude
          printf 'must-not-enter-build-context\n' > .claude/review-secret
          docker build --target context-audit -f docker/linux-test.Dockerfile .
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux Tauri build libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Run Linux desktop checks
        shell: bash
        run: bash scripts/linux-container-test.sh desktop --install
      - name: Strict desktop Clippy
        run: >-
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings
