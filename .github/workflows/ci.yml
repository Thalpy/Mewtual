name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # This workflow only validates source; run the newest PR or main revision.
  cancel-in-progress: true

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Cargo does not run unit tests inside a dependency excluded from workspace membership.
      # Exercise the actual patched upstream observers without adding its dev graph to our lock.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bounded Automerge history observers
        run: node scripts/test-automerge-observer.mjs
      # These bounded actor tests diagnose clock/transport boundaries before the much longer
      # complete workspace run. A failure still fails this job; no full-suite gate is replaced.
      - name: File transfer actor boundaries
        run: cargo test -p catcoms-app --all-features --lib actor::file_transfers::tests
      # Run these original-source races separately so their assertion output survives a
      # later process-level abort in the full test binary. These are real production-path
      # tests on both platforms; this neither retries a failure nor replaces the full gate.
      - name: Original source and retained-root boundaries
        run: >-
          cargo test -p catcoms-app --all-features --lib -- --test-threads=1
          other_group_actual_admission_progresses_while_source_a_holds_file_io_mutex
          cancelled_original_before_io_cannot_publish_or_revive_across_a_new_generation
          source_open_wait_cannot_lend_stale_authority_to_the_first_page_effect
          archive_current_declaration_with_missing_root_is_never_recreated_from_its_seed
          archive_replacement_after_target_notfound_is_rejected_before_old_issuance
          archive_target_notfound_requires_the_same_held_root_and_marker_objects
      - name: Automatic repair and authenticated peer receipt
        id: repair_receipt
        run: >-
          cargo test --locked -p catcoms-app --all-features --lib
          durable_chat::repair_effects_tests::automatic_repair_tracks_send_before_real_peer_receipt_without_frontend_retry
          -- --exact --nocapture --test-threads=1
      - name: Test
        # Collect the full workspace result even if the focused receipt regression fails.
        if: ${{ !cancelled() && (success() || steps.repair_receipt.outcome == 'failure') }}
        # The user deferred only this known slow cost case until final Chat V2
        # acceptance. With no positive filter, every other workspace test still
        # executes. This intermediate gate is not final unfiltered acceptance.
        run: >-
          cargo test --all --all-features --no-fail-fast --
          --skip cold_provider_transfers_only_one_missing_change_after_ten_thousand_operations
      # WMI accepts independent broad windows/windows-core ranges. A valid lock resolution
      # can mix their incompatible COM interfaces while all Linux builds still pass. Check
      # that native dependency on Windows without compiling the entire WebView application.
      - name: Native Windows COM binding compatibility
        if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -p wmi
        env:
          CARGO_TARGET_DIR: target
      - name: Ambient-dependency gate
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-no-ambient.sh
      - name: Store raw-fs gate (I-4)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-store-raw-fs.sh

  deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      # The native workspace has an independent graph (including updater/WebView dependencies).
      # Audit it completely; a Root pass does not cover it. Keep the shared config explicit so
      # a deny.toml under apps/desktop cannot silently replace the reviewed fences.
      - name: Desktop workspace supply chain
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          # Setting `arguments` replaces the action's default `--all-features`; keep it, since
          # release builds enable `custom-protocol`.
          arguments: --all-features --config=deny.toml
          command: check

  linux-desktop:
    name: Linux frontend & Tauri
    runs-on: ubuntu-latest
    env:
      # Match linux-container-test.sh and keep the later Clippy step in that target.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/linux-container
    steps:
      - uses: actions/checkout@v4
      - name: Audit the default-deny Docker build context
        run: |
          mkdir -p .claude
          printf 'must-not-enter-build-context\n' > .claude/review-secret
          docker build --target context-audit -f docker/linux-test.Dockerfile .
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> ../../../target/linux-container
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux Tauri build libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Run Linux desktop checks
        shell: bash
        run: bash scripts/linux-container-test.sh desktop --install
      - name: Strict desktop Clippy
        run: >-
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings
