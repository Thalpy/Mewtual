name: Chat V2 joined-source focused execution

on:
  pull_request:
    # Explicit integration-PR lane while inherited lint debt blocks ordinary CI's tests.
    # Full/strict gates remain required; this is not all-source coverage after merge.
    paths:
      - '.github/workflows/chat-v2-joined-source.yml'
      - '.github/scripts/check-chat-v2-joined-source.py'
      - '.github/scripts/check-chat-v2-native-registry.py'
      - '.github/predecessor/namespace7_gate.rs'
      - 'crates/catcoms-app/src/store/critical_namespaces/native_registry/**'
      - 'crates/catcoms-app/src/store/critical_namespaces/native_registry.rs'
      - 'crates/catcoms-app/src/store/critical_namespaces/native7_predecessor_tests.rs'
      - 'crates/catcoms-app/src/store/persistence/native_registry.rs'
  workflow_dispatch:
    inputs:
      fresh_founder_only:
        description: Run only fresh-founder library regressions (not native acceptance).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chat-v2-joined-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2

jobs:
  focused:
    name: Chat cohorts (${{ matrix.os }}, fresh-only=${{ inputs.fresh_founder_only || false }})
    runs-on: ${{ matrix.os }}
    # Head cohorts plus pinned namespace5 and ID3/ID5-aware namespace7 predecessors.
    # Per-cohort bounds are unchanged; this only covers the additional build work.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact-count rejection guards without Cargo
        run: python .github/scripts/check-chat-v2-joined-source.py --self-test
      - name: Check native-registry predecessor count guards
        if: ${{ !inputs.fresh_founder_only }}
        run: python .github/scripts/check-chat-v2-native-registry.py --self-test
      - name: Execute selected exact-count regressions
        run: python .github/scripts/check-chat-v2-joined-source.py ${{ inputs.fresh_founder_only && '--fresh-founder-only' || '' }}
      - name: Execute member-storage regressions and the real predecessor gate
        if: ${{ !inputs.fresh_founder_only }}
        run: python .github/scripts/check-chat-v2-member-save.py
      - name: Execute the ID3 and ID5 aware native-registry predecessor gate
        if: ${{ !inputs.fresh_founder_only }}
        run: python .github/scripts/check-chat-v2-native-registry.py
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: Install frontend dependencies for the actual compiled audit component
        if: runner.os == 'Linux'
        run: npm --prefix apps/desktop ci
      - name: Execute the full frontend suite
        if: runner.os == 'Linux'
        run: npm --prefix apps/desktop test
      - name: Check frontend types
        if: runner.os == 'Linux'
        run: npm --prefix apps/desktop run check
      - name: Build frontend assets
        if: runner.os == 'Linux'
        run: npm --prefix apps/desktop run build
      - name: Check root formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      # Keep an affected-crate strict result visible separately from inherited App debt.
      # This does not replace or relax the required workspace-wide Clippy job.
      - name: Strict Clippy for the affected protocol crates
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p catcoms-replication -p catcoms-sync --all-targets --all-features -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-v2-joined-source-${{ matrix.os }}
          path: |
            logs/chat-v2-joined-source/
            logs/chat-v2-native-registry/
