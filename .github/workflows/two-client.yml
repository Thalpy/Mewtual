name: Receipt workspace diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Original receipt, workspace graph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unchanged production and test source
        shell: python
        run: |
          import subprocess
          subprocess.run(['git', 'rev-parse', 'HEAD'], check=True)
          subprocess.run([
              'git', 'diff', '--exit-code', 'f80c3e9cb7125f8775ef538b970b24549f56ae13',
              '--', 'crates', 'bins', 'vendor', 'Cargo.toml', 'Cargo.lock',
          ], check=True)
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Exact receipt with full workspace feature selection
        shell: python
        run: |
          import re
          import subprocess
          import sys
          target = 'durable_chat::repair_effects_tests::automatic_repair_tracks_send_before_real_peer_receipt_without_frontend_retry'
          command = ['cargo', 'test', '--locked', '--all', '--all-features', '--no-fail-fast',
                     target, '--', '--exact', '--nocapture', '--test-threads=4']
          result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  encoding='utf-8', errors='replace')
          print(result.stdout, flush=True)
          if result.returncode:
              sys.exit(result.returncode)
          plain = re.sub(r'\x1b\[[0-9;]*m', '', result.stdout)
          counts = re.findall(r'test result: ok\. (\d+) passed;', plain)
          assert sum(map(int, counts)) == 1, 'Exact diagnostic must execute precisely one test'
          assert re.search(re.escape(target) + r' \.\.\. ok', plain), 'Original receipt case did not pass'
      - name: Original early App cohort in the same workspace binary
        shell: python
        run: |
          import re
          import subprocess
          import sys
          target = 'durable_chat::repair_effects_tests::automatic_repair_tracks_send_before_real_peer_receipt_without_frontend_retry'
          command = ['cargo', 'test', '--locked', '--all', '--all-features', '--no-fail-fast',
                     '--', 'actor::', 'chat_history_tests::', 'creative::', 'durable_chat::',
                     '--nocapture', '--test-threads=4']
          result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  encoding='utf-8', errors='replace')
          print(result.stdout, flush=True)
          if result.returncode:
              sys.exit(result.returncode)
          plain = re.sub(r'\x1b\[[0-9;]*m', '', result.stdout)
          assert re.search(re.escape(target) + r' \.\.\. ok', plain), 'Cohort omitted the original receipt case'
