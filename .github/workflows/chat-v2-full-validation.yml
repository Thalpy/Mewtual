name: Chat V2 integration test execution

on:
  # An explicit execution lane for this integration PR while its inherited strict-lint
  # debt prevents ordinary CI from reaching the tests. Later source PRs still use normal
  # CI; this workflow-only filter is not an all-source validation policy after merge.
  pull_request:
    paths:
      - '.github/workflows/chat-v2-full-validation.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: Workspaces to execute; all is the normal validation run.
        type: choice
        options: [all, root, native, native-focused, native-lock, native-join, native-mutations, native-founder-restart]
        default: all
      run_deferred_catchup:
        description: Include the slow case at final Chat V2 acceptance (scope all or root).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chat-v2-complete-tests-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2

jobs:
  root:
    name: Root tests, slow case deferred (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'root'
    runs-on: ${{ matrix.os }}
    # Both OSes have reached the old aggregate120-minute CI bound while
    # individual tests still reported progress (Linux run43547127334 included).
    # Keep every test/protocol deadline and the one explicit deferral unchanged;
    # this is an outer job allowance for the growing complete workspace.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check original route custody and collection regressions
        run: >-
          cargo test --locked -p catcoms-sync --all-features --lib -- --exact --test-threads=1
          voice_endpoint::ingress::tests::protected::protected_root_hello_returns_signed_admission_and_exact_lost_ack_without_new_work
          voice_endpoint::ingress::tests::protected::protected_root_queued_ack_epoch_change_revokes_before_driver_send_and_first_result
          voice_endpoint::ingress::tests::protected::ready::source::key_release_after_ready_queue_revokes_actual_lower_without_early_refund
          voice_endpoint::ingress::tests::protected::ready::source::root_ready_source_actual_signed_ack_uses_original_capacity_with_full_ordinary_crypto_and_bytes
          voice_endpoint::ingress::tests::protected_start::progress::protected_source_and_signed_ack_keep_original_capacity_under_full_ordinary_pressure
      # No warning override, stack increase, retry or ignored-test substitution.
      # --no-fail-fast collects other crate results after a failure; it still fails the job.
      # Strict Clippy and dependency audits remain separate mandatory gates in ci.yml.
      # The user explicitly deferred this one unusually slow case until final Chat V2
      # acceptance. Keep the test intact and make the execution exception visible. This
      # intermediate run cannot claim complete root sign-off until that case also passes.
      - name: Run root workspace except the explicitly deferred cost case
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked --all --all-features --no-fail-fast --
          --exact --skip cold_provider_transfers_only_one_missing_change_after_ten_thousand_operations
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.run_deferred_catchup && runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Run exactly one deferred cost case at final acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.run_deferred_catchup && runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy

          guard = runpy.run_path('.github/scripts/check-chat-v2-member-save.py')
          directory = Path('logs/chat-v2-final-catchup')
          directory.mkdir(parents=True, exist_ok=True)
          command = [
              'cargo', 'test', '--locked', '-p', 'catcoms-replication', '--all-features',
              '--test', 'catchup_cost',
              'cold_provider_transfers_only_one_missing_change_after_ten_thousand_operations',
              '--', '--exact',
          ]
          code, summaries, timed_out, _ = guard['run_logged'](
              'deferred-catchup', command, directory, limit=45 * 60,
          )
          if timed_out:
              raise RuntimeError('deferred catch-up cost case exceeded its deadline')
          guard['validate'](''.join(summaries), code, 1)
          PY

  native:
    name: Native tests (${{ matrix.os }}, ${{ inputs.scope || 'all' }})
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'root'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux Tauri build libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci
      - name: Run the complete frontend tests
        if: runner.os == 'Linux' && inputs.scope != 'native-lock' && inputs.scope != 'native-join' && inputs.scope != 'native-mutations' && inputs.scope != 'native-founder-restart'
        run: npm --prefix apps/desktop test
      - name: Check focused Chat V2 renderer history and session retirement
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && (inputs.scope == 'native-join' || inputs.scope == 'native-mutations')
        working-directory: apps/desktop
        run: >-
          node --experimental-strip-types --import ./scripts/test-dom.mjs
          --import ./scripts/test-svelte.mjs --test
          src/native-text-history.test.ts src/native-text-app.test.ts src/native-saved-chat.test.ts
          src/native-text-driver.test.ts src/native-text-intents.test.ts src/native-text-session.test.ts
      - name: Check frontend types
        if: runner.os == 'Linux' && inputs.scope != 'native-lock'
        run: npm --prefix apps/desktop run check
      # Native builds consume real frontend assets; build them on both operating systems.
      - name: Build frontend assets
        run: npm --prefix apps/desktop run build
      - name: Check original native IPC and delayed-reply custody regressions
        if: inputs.scope != 'native-lock' && inputs.scope != 'native-join' && inputs.scope != 'native-mutations' && inputs.scope != 'native-founder-restart'
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --exact --test-threads=1
          voice_activation_tests::admitted_ipc::admitted_commands_cross_real_tauri_json_dispatch_and_recover_locked_history
          voice_handoff::commands::tests::ready_and_closed_share_one_guard_and_delayed_closed_body_remains_paid_after_collection
      - name: Run the complete native workspace
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'native') }}
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-fail-fast
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'native-focused' || inputs.scope == 'native-lock' || inputs.scope == 'native-join' || inputs.scope == 'native-mutations' || inputs.scope == 'native-founder-restart')
        with:
          python-version: '3.12'
      - name: Run exact native gate regressions (focused, not complete acceptance)
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'native-focused'
        run: python .github/scripts/check-chat-v2-native-gates.py
      - name: Check native UI retirement and original lock worker lifetimes
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'native-lock'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy

          guard = runpy.run_path('.github/scripts/check-chat-v2-member-save.py')
          directory = Path('logs/chat-v2-native-gates')
          directory.mkdir(parents=True, exist_ok=True)
          command = ['cargo', 'test', '--locked', '--manifest-path',
                     'apps/desktop/src-tauri/Cargo.toml', '--lib',
                     'native_text_retirement_', '--', '--test-threads=1']
          code, summaries, timed_out, _ = guard['run_logged'](
              'native-ui-retirement', command, directory, limit=45 * 60,
          )
          if timed_out:
              raise RuntimeError('native UI retirement exceeded its deadline')
          guard['validate'](''.join(summaries), code, 4)
          PY
      - name: Check focused native chat dispatch and restart
        if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'native-join' || inputs.scope == 'native-mutations' || inputs.scope == 'native-founder-restart')
        shell: bash
        env:
          RUST_BACKTRACE: '1'
          CHAT_V2_NATIVE_SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import runpy

          guard = runpy.run_path('.github/scripts/check-chat-v2-member-save.py')
          directory = Path('logs/chat-v2-native-gates')
          directory.mkdir(parents=True, exist_ok=True)
          cases = [
              ('native-send-parser', 'native_text_send_parser_', 1),
              ('native-mutation-dispatch', 'native_text_mutations_', 1),
              ('native-retry-continuity', 'native_text::continuity::tests::', 3),
              ('native-membership-parser', 'native_text::membership::tests::native_membership_requires_the_exact_admission', 1),
              ('native-membership-dispatch', 'native_text::tests::native_text_membership_dispatch_uses_the_original_founder_row', 1),
          ]
          scope = os.environ['CHAT_V2_NATIVE_SCOPE']
          if scope == 'native-join':
              cases.insert(0, ('native-join-dispatch', 'native_text_connected_join_', 5))
          elif scope == 'native-founder-restart':
              cases = [(
                  'native-founder-restart',
                  'native_text::tests::native_text_connected_join_gated_route_publishes_one_original_joined_row',
                  1,
              ), (
                  'native-founder-welcome-retry',
                  'native_text::tests::native_text_connected_join_retries_original_welcome_after_authenticated_unlock',
                  1,
              ), (
                  'native-membership-parser',
                  'native_text::membership::tests::native_membership_requires_the_exact_admission',
                  1,
              ), (
                  'native-membership-dispatch',
                  'native_text::tests::native_text_membership_dispatch_uses_the_original_founder_row',
                  1,
              )]
          failures = []
          for name, pattern, count in cases:
              command = ['cargo', 'test', '--locked', '--manifest-path',
                         'apps/desktop/src-tauri/Cargo.toml', '--lib', pattern,
                         '--', '--test-threads=1']
              if scope == 'native-founder-restart':
                  command.append('--exact')
              code, summaries, timed_out, _ = guard['run_logged'](
                  name, command, directory, limit=45 * 60,
              )
              if timed_out:
                  failures.append(f'{name} exceeded its deadline')
                  continue
              try:
                  guard['validate'](''.join(summaries), code, count)
              except RuntimeError as error:
                  failures.append(f'{name}: {error}')
          if failures:
              raise RuntimeError('\n'.join(failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-v2-native-gates-${{ matrix.os }}
          path: logs/chat-v2-native-gates/
      # Collect the separate compile gate even if a native test fails, without masking it.
      - name: Check the native workspace
        if: ${{ !cancelled() }}
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
