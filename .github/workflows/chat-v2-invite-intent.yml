name: Chat V2 invitation journal

on:
  pull_request:
    paths:
      - '.github/workflows/chat-v2-invite-intent.yml'
      - '.github/scripts/check-chat-v2-invite-intent.py'
      - '.github/scripts/check-chat-v2-joined-predecessor.py'
      - '.github/scripts/check-chat-v2-member-save.py'
      - '.github/predecessor/governed_add_fence_control.rs'
      - '.github/predecessor/governed_add_fence_owner.rs'
      - '.github/predecessor/joined_pin_gate.rs'
      - 'crates/catcoms-app/src/store/native_text_invite.rs'
      - 'crates/catcoms-app/src/store.rs'
      - 'crates/catcoms-app/src/store/critical_namespaces/joined_pin.rs'
      - 'crates/catcoms-app/src/store/critical_namespaces/joined_pin/**'
      - 'crates/catcoms-app/src/store/critical_namespaces/native_registry/operational/governed.rs'
      - 'crates/catcoms-app/src/store/critical_namespaces/native_registry/operational/governed/**'
      - 'crates/catcoms-app/src/store/critical_namespaces/governance_layout/**'
      - 'crates/catcoms-app/src/store/persistence/governance_layout/**'
      - 'crates/catcoms-app/src/store/critical_namespaces/pending_join_codec.rs'
      - 'crates/catcoms-app/src/store/critical_namespaces/pending_join/producer.rs'
      - 'crates/catcoms-app/src/store/native_text_invite/**'
      - 'crates/catcoms-app/src/store/persistence/v2_text/control.rs'
      - 'crates/catcoms-app/src/store/persistence/v2_text/control/**'
