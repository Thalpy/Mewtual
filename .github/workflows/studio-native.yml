name: Studio native regression tests

on:
  pull_request:
    paths:
      - '.github/workflows/studio-native.yml'
      - 'crates/catcoms-app/**'
      - 'crates/catcoms-sync/**'
      - 'crates/catcoms-replication/**'
      - 'apps/desktop/src-tauri/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Prepare desktop assets
        run: |
          npm ci --prefix apps/desktop
          npm run build --prefix apps/desktop
      # This executes the native tests independently of frontend packaging and the existing
      # strict CI lint gate. It does not replace or relax that gate; existing unused future
      # security-intent APIs currently stop that job before it can run native regressions.
      - name: Test native Studio boundaries
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib studio:: -- --test-threads=4
