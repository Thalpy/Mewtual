[package]
name = "catcoms-replication"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-wire = { path = "../catcoms-wire" }
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-mls = { path = "../catcoms-mls" }
catcoms-rt = { path = "../catcoms-rt" }
# For the shared padded-frame codec (`catcoms_storage::pad`) that quantizes a sealed op's size.
# Storage is the lowest crate this crate and `filecrypto` have in common; one implementation of
# the unpadder is worth more than a tidier module tree. See that module's header.
catcoms-storage = { path = "../catcoms-storage" }
thiserror.workspace = true
automerge = "0.10"
blake3 = "1"
sha2 = "0.10"

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"

[lints]
workspace = true
