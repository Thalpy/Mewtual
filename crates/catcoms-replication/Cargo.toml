[package]
name = "catcoms-replication"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-wire = { path = "../catcoms-wire" }
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-mls = { path = "../catcoms-mls" }
catcoms-rt = { path = "../catcoms-rt" }
# For the shared padded-frame codec (`catcoms_storage::pad`) that quantizes a sealed op's size.
# Storage is the lowest crate this crate and `filecrypto` have in common; one implementation of
# the unpadder is worth more than a tidier module tree. See that module's header.
catcoms-storage = { path = "../catcoms-storage" }
thiserror.workspace = true
automerge = "0.10"
blake3 = "1"
sha2 = "0.10"
hmac = "0.12"
zeroize = "1"
serde_json = "1"

[features]
# Test instrumentation only: a per-thread count of branch reconstructions
# (`studio::overlay_reconstructions_on_this_thread`), so a dependent crate's tests can pin a path as
# reconstruction-free. Turned on only by catcoms-app's dev-dependency; with resolver 2 a
# dev-dependency's features never reach a non-test build.
test-counters = []

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"

[lints]
workspace = true
