[package]
name = "catcoms-sync"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-rt = { path = "../catcoms-rt" }
catcoms-replication = { path = "../catcoms-replication" }
catcoms-mls = { path = "../catcoms-mls" }
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-storage = { path = "../catcoms-storage" }
catcoms-wire = { path = "../catcoms-wire" }
catcoms-discovery = { path = "../catcoms-discovery" }
thiserror.workspace = true
bytes.workspace = true
futures.workspace = true
# Cancellation signalling only; production execution still uses the catcoms-rt clock seam.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
blake3 = "1"
hex = "0.4"
automerge = "0.10"
zeroize = "1"

[dev-dependencies]
# Only the test module needs it: the recording transport that proves an applied Remove reaches
# `MeshTransport::evict_peer` has to implement the (async-trait) seam itself.
async-trait.workspace = true
catcoms-log = { path = "../catcoms-log" }
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-net = { path = "../catcoms-net" }
rand_chacha = "0.3"
rand_core = "0.6"
# A log-volume guard has to read what was actually emitted. Asserting on the state the code keeps
# to suppress a repeat would pass just as happily if the suppression stopped being consulted.
tracing-subscriber = "0.3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
libp2p = { version = "0.56", features = ["tokio"] }

[lints]
workspace = true
