[package]
name = "catcoms-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-rt = { path = "../catcoms-rt" }
catcoms-wire = { path = "../catcoms-wire" }
thiserror.workspace = true
blake3 = "1"
hex = "0.4"
zeroize = "1"
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# Journaled Download export proves a partly written file in Downloads is still the object Mewtual
# created by the identity of an open handle (volume serial, file index, link count). std keeps
# those Windows fields unstable and the workspace denies `unsafe_code`, so use this small, safe
# wrapper of GetFileInformationByHandle. Unlicense OR MIT; already in the native lockfile; it
# reuses the windows-sys 0.61 already resolved in this workspace.
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
# Open flags std does not name (O_NONBLOCK, O_NOFOLLOW, O_DIRECTORY), passed through std's safe
# `OpenOptionsExt::custom_flags`, so a FIFO swapped in for a destination file or folder cannot
# block an open forever (review L11 and U-M6). Constants only, no `unsafe` calls. MIT OR
# Apache-2.0; already resolved in this workspace at the same version.
libc = "0.2"

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"
tempfile = "3"

[lints]
workspace = true
