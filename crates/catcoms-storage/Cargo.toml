[package]
name = "catcoms-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-rt = { path = "../catcoms-rt" }
catcoms-wire = { path = "../catcoms-wire" }
thiserror.workspace = true
blake3 = "1"
hex = "0.4"
zeroize = "1"
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# Journaled Download export proves a partly written file in Downloads is still the object Mewtual
# created by the identity of an open handle (volume serial, file index, link count). std keeps
# those Windows fields unstable and the workspace denies `unsafe_code`, so use this small, safe
# wrapper of GetFileInformationByHandle. Unlicense OR MIT; already in the native lockfile; it
# reuses the windows-sys 0.61 already resolved in this workspace.
winapi-util = "0.1.11"
# PR51 H1: delete exactly the object whose identity was verified, through that same handle
# (`fs_at::os::windows::FileExt::delete_by_handle`: SetFileInformationByHandle with POSIX
# semantics, falling back to classic disposition, never re-resolving a name). The workspace
# denies `unsafe_code`; this is the vetted safe wrapper (Robert Collins, the remove_dir_all and
# rustup maintainer). Apache-2.0. Pinned exactly. `FileExt` deletes; since the coordinator's
# review L1 `OpenOptions::open_at` (NtCreateFile relative to a held folder handle) also opens a
# name read-only, with `FILE_OPEN` and follow off, only to compare its identity: its fixed share
# mode (read, write and delete for everyone) is harmless for a check that holds nothing, and
# `FILE_OPEN` succeeds only with `FILE_OPENED`, so its unimplemented information paths are not
# reached. Never used to create, write or pin. Windows-only, so Unix builds do not compile it.
fs_at = "=0.2.1"

[target.'cfg(unix)'.dependencies]
# Open flags std does not name (O_NONBLOCK, O_NOFOLLOW, O_DIRECTORY), passed through std's safe
# `OpenOptionsExt::custom_flags`, so a FIFO swapped in for a destination file or folder cannot
# block an open forever (review L11 and U-M6). Constants only, no `unsafe` calls. MIT OR
# Apache-2.0; already resolved in this workspace at the same version.
libc = "0.2"
# PR51 H1/M1/M3: directory-relative rename, open, unlink and link against a pinned folder
# descriptor, `fstatfs` for the filesystem type and the effective uid for the shared-folder rule,
# all through safe APIs (Bytecode Alliance; Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR
# MIT). Already in both lock files at this version through `tempfile`.
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"
tempfile = "3"

[lints]
workspace = true
