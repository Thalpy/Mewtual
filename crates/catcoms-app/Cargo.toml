[package]
name = "catcoms-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-rt = { path = "../catcoms-rt" }
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-mls = { path = "../catcoms-mls" }
catcoms-sync = { path = "../catcoms-sync" }
catcoms-storage = { path = "../catcoms-storage" }
catcoms-wire = { path = "../catcoms-wire" }
automerge = "0.10"
# The server icon rides base64 inside the livery document; decoded here only to validate
# it (well-formed, and within the byte cap) before it is gossiped.
base64 = "0.22"
blake3 = "1"
zeroize = "1"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
