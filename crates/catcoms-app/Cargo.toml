[package]
name = "catcoms-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-rt = { path = "../catcoms-rt" }
catcoms-crypto = { path = "../catcoms-crypto" }
catcoms-discovery = { path = "../catcoms-discovery" }
catcoms-mls = { path = "../catcoms-mls" }
catcoms-sync = { path = "../catcoms-sync" }
catcoms-storage = { path = "../catcoms-storage" }
catcoms-wire = { path = "../catcoms-wire" }
automerge = "0.10"
# The server icon rides base64 inside the livery document; decoded here only to validate
# it (well-formed, and within the byte cap) before it is gossiped.
base64 = "0.22"
blake3 = "1"
# Pasteable blobs (pairing request, grant bundle) are hex, exactly like an invite.
hex = "0.4"
zeroize = "1"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
# The product layer is transport-generic, so almost every test here runs on the in-memory mesh.
# `tcp_product_e2e` is the exception: connect/disconnect only exist on a real transport, and
# presence is defined in terms of them, so that one test needs a real libp2p node.
catcoms-net = { path = "../catcoms-net" }
catcoms-log = { path = "../catcoms-log" }
libp2p = { version = "0.56", features = ["tokio"] }
rand_chacha = "0.3"
rand_core = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
