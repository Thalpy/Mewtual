[package]
name = "catcoms-crypto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-wire = { path = "../catcoms-wire" }
catcoms-rt = { path = "../catcoms-rt" }
thiserror.workspace = true
# Pure-Rust crypto on the hot path (supply-chain decision: no C/asm blobs).
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
blake3 = "1"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"

[lints]
workspace = true
