[package]
name = "catcoms-rt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
async-trait.workspace = true
bytes.workspace = true
# `time` is not in the workspace default set, but `SystemClock::sleep` needs it. It used to build
# only because some other crate in the graph happened to enable it, so a dependent that pulled in
# catcoms-rt on its own failed to compile.
tokio = { workspace = true, features = ["time"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
