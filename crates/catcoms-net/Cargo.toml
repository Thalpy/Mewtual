[package]
name = "catcoms-net"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-rt = { path = "../catcoms-rt" }
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
blake3 = "1"
hex = "0.4"
# libp2p's `upnp` behaviour speaks IGD only. PCP and NAT-PMP cover routers that expose the
# newer/Apple-style mapping protocols instead. Pin 0.18 because it is the maintained release whose
# declared MSRV still matches this workspace's Rust 1.89 baseline (0.19 requires Rust 1.91).
portmapper = { version = "=0.18.0", default-features = false }
# PEM decoding for the operator-supplied TCP/443 TLS certificate. Already in the tree via
# rustls (QUIC + libp2p-tls), so this adds no new crate, only a direct edge to it.
rustls-pki-types = { version = "1.14", features = ["std"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
libp2p = { version = "0.56", features = [
    "tokio",
    "gossipsub",
    "request-response",
    "noise",
    "yamux",
    "macros",
    "tcp",
    # QUIC alongside TCP: UDP hole-punching is materially more reliable than TCP's, so a
    # NAT'd peer that cannot be reached over TCP often still comes up over QUIC (and the
    # DCUtR upgrade path gets a second, better transport to work with).
    "quic",
    "relay",
    "dcutr",
    "identify",
    "ping",
    "rendezvous",
    # AutoNAT v2 lets a connected, publicly reachable peer or infrastructure node dial this
    # node back and verify an address from outside. It measures reachability; it does not create
    # a path through NAT, so relay/DCUtR remain the fallback when the probe fails.
    "autonat",
    "upnp",
    # Rung 4 of the connectivity ladder: a TLS/WebSocket listener on TCP/443. Corporate,
    # university and guest networks routinely filter outbound traffic to arbitrary high
    # ports, and today every rung fails identically there. `dns` is not optional here:
    # the builder's websocket phase resolves through `libp2p_dns` unconditionally.
    "websocket",
    "tls",
    "dns",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
