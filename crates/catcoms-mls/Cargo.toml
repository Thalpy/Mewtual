[package]
name = "catcoms-mls"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-wire = { path = "../catcoms-wire" }
catcoms-crypto = { path = "../catcoms-crypto" }
thiserror.workspace = true
# 0.8.3 is the floor, not just the lockfile choice: it fixes GHSA-gc79-23g3-8g52 (0.8.2:
# unbounded recursion decoding nested extensions aborts the process), GHSA-94v4-rg25-x625 and
# GHSA-p276-g3f3-wwgh. Stored-state compatibility is pinned by persist/compat_tests.rs.
openmls = "0.8.3"
openmls_rust_crypto = "0.5"
blake3 = "1"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
tls_codec = { version = "0.4", features = ["derive", "std"] }
zeroize = "1"

[dev-dependencies]
# Real restored-group catalog regressions alter one existing MemoryStorage JSON field. This
# uses the already-resolved dependency; no snapshot or secret storage content is printed.
serde_json = "1"

[lints]
workspace = true
