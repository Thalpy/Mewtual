[package]
name = "catcoms-mls"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
catcoms-wire = { path = "../catcoms-wire" }
catcoms-crypto = { path = "../catcoms-crypto" }
thiserror.workspace = true
# 0.9.2 is the floor, not just the lockfile choice. Besides the advisories 0.8.3 fixed
# (GHSA-gc79-23g3-8g52, GHSA-94v4-rg25-x625, GHSA-p276-g3f3-wwgh), 0.9.0 fixes two
# pre-authentication DoS issues the 0.8 line never received (GHSA-w62v-gv48-63rh quadratic
# extension checks, GHSA-rrmv-c79f-cf5r out-of-bounds panic), and 0.9.1 the 0.9.0 recursion
# variant. Stored state written by 0.8.1 keeps loading: persist/compat_tests.rs pins it, and the
# 0.9-to-0.8 direction is recorded in docs/design-crypto-bigint-upgrade.md. 0.9 does NOT clear
# RUSTSEC-2026-0387: openmls_rust_crypto 0.6 and basic_credential 0.6 still use p256 0.13.
openmls = "0.9.2"
openmls_rust_crypto = "0.6"
blake3 = "1"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
# Must match the tls_codec line openmls itself uses (0.5 for openmls 0.9), or its codec traits
# are not the ones in scope here.
tls_codec = { version = "0.5", features = ["derive", "std"] }
zeroize = "1"

[features]
# Test fixtures only: builders for MLS messages this product never sends (a self-update proposal,
# an external commit), so a dependent crate can prove its commit path refuses them
# (`group/commit_gate.rs`). Turned on only by catcoms-sync's dev-dependency; with resolver 2 a
# dev-dependency's features never reach a non-test build.
test-support = []

[dev-dependencies]
# Real restored-group catalog regressions alter one existing MemoryStorage JSON field. This
# uses the already-resolved dependency; no snapshot or secret storage content is printed.
serde_json = "1"

[lints]
workspace = true
