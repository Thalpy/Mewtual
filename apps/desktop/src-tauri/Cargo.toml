[package]
name = "catcoms-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "CatComs desktop app (Tauri 2)"

[lib]
name = "catcoms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
libp2p = { version = "0.56", features = ["tokio"] }
catcoms-app = { path = "../../../crates/catcoms-app" }
catcoms-mls = { path = "../../../crates/catcoms-mls" }
catcoms-net = { path = "../../../crates/catcoms-net" }
catcoms-rt = { path = "../../../crates/catcoms-rt" }

# Own workspace so the heavy Tauri/webview deps stay out of the root `cargo test --all`.
[workspace]
