[package]
name = "mewtual-desktop"
version = "0.3.0-alpha.20"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Mewtual desktop app (Tauri 2)"

[lib]
name = "mewtual_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri's mode/origin decision follows this feature, including packaged debug builds.
# Native tests/development keep the default devUrl; packaging opts into embedded assets.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads security/command-policy.json to feed the ACL manifest, so the reviewed policy and
# the enforced command list cannot drift. Already in the dependency graph via tauri-build.
serde_json = "1"

[dependencies]
# Disabled native handoff codec. These exact versions already exist in this lockfile;
# explicit edges account for their newly reachable local-channel use independently of MLS.
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
# Newly reachable secret local-channel ECDH, not just an already-transitive public-key parser.
# The bootstrap source review records arithmetic/zeroization limits. This edge requests only
# ECDH. 0.14 is required, not cosmetic: it moves the native secret scalar onto crypto-bigint
# >= 0.7.6 (RUSTSEC-2026-0387). p256 0.13 stays in the graph for openmls only, where no secret
# reaches it (docs/design-crypto-bigint-upgrade.md). Keep `default-features = false`: nothing else depends on
# p256 0.14 here, so `precomputed-tables` stays off and the bootstrap layout guard stays valid.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh"] }
# p256 0.14 takes rand_core 0.10 RNGs; catcoms-rt's seam is rand_core 0.6. Only the trait bridge
# in voice_handoff/channel/bootstrap.rs uses this. Already in this lockfile.
rand_core_0_10 = { package = "rand_core", version = "=0.10.1", default-features = false }
async-trait = "0.1"
bytes = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
libp2p = { version = "0.56", features = ["tokio"] }
hex = "0.4"
base64 = "0.22"
zeroize = "1"
catcoms-app = { path = "../../../crates/catcoms-app" }
catcoms-mls = { path = "../../../crates/catcoms-mls" }
catcoms-net = { path = "../../../crates/catcoms-net" }
catcoms-rt = { path = "../../../crates/catcoms-rt" }
catcoms-sync = { path = "../../../crates/catcoms-sync" }
catcoms-storage = { path = "../../../crates/catcoms-storage" }
catcoms-discovery = { path = "../../../crates/catcoms-discovery" }
catcoms-diagnostics = { path = "../../../crates/catcoms-diagnostics" }
catcoms-log = { path = "../../../crates/catcoms-log" }
# The router-mapping stack already pins this monitor transitively. Declare it directly because the
# desktop owns the process-wide OS route/interface watcher used by post-join self-healing.
netwatch = "=0.19.3"
n0-watcher = "=1.0.1"
# The bridge emits its own spans now: log_ui carries what the webview saw into the same file.
tracing = "0.1"
# Shared images are decoded here rather than by WebView2, so a malicious-but-valid file meets a
# memory-safe decoder instead of a C one. See `src/media_decode.rs` for what that does and does
# not buy. `default-features = false` is load-bearing twice over: it drops `rayon` (no decoder
# thread pool inside the media handler) and it drops every format we do not admit, so the code
# for dds/exr/hdr/pnm/qoi/tga/farbfeld is not compiled in at all. `avif` and `avif-native` stay
# off deliberately: the first is an encoder (ravif) and the second is a binding to the C libdav1d,
# which would put us straight back where we started.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
# Used directly for the output side. `image`'s PNG encoder cannot write APNG, and flattening every
# shared GIF to a still frame is a visible product regression. Same 0.18 line `image` resolves, so
# this adds a direct path to a crate already in the graph rather than a second copy of it.
png = "0.18"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
catcoms-crypto = { path = "../../../crates/catcoms-crypto" }
tokio = { version = "1", features = ["io-util", "process"] }
automerge = "0.10"
catcoms-replication = { path = "../../../crates/catcoms-replication" }
catcoms-wire = { path = "../../../crates/catcoms-wire" }
tempfile = "3"
rand_chacha = "0.3"
rand_core = "0.6"

# Own workspace so the heavy Tauri/webview deps stay out of the root `cargo test --all`.
[workspace]
