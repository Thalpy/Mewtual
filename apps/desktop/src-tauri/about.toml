# cargo-about configuration: the Rust half of THIRD-PARTY-NOTICES.
#
# This is a notice-generation config, not a policy gate. deny.toml is the gate: it decides which
# licences may enter the tree at all. This list only has to recognise what deny.toml already
# allows, so that every crate we ship has its text collected rather than skipped.
#
# Regenerate with: npm --prefix apps/desktop run notices

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
]

# We ship an x64 Windows binary today. Collecting only the targets we actually build keeps
# notices for platforms we do not distribute out of the file.
targets = ["x86_64-pc-windows-msvc"]

# Our own crates are `publish = false` and carry no `license` field; the project's terms live in
# /LICENSE. There is nothing for cargo-about to collect from them, so skip them rather than
# warn once per crate on every run.
private = { ignore = true }

workarounds = ["ring"]

[ring]
accepted = ["OpenSSL"]
